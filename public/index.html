<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Quizzy</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <main class="main-content">
            <section class="section">
                <div id="imgUploadArea" class="upload-area" tabindex="0" role="button" aria-label="Carica immagini del quiz">
                    <input type="file" id="imgInput" accept="image/*" multiple aria-hidden="true">
                    <div class="upload-label" id="imgLabel">Seleziona immagini</div>
                    <div class="upload-sublabel" id="imgSublabel">Puoi selezionare più file contemporaneamente</div>
                    <div class="status-text" id="imgStatus"></div>
                </div>
            </section>
        </main>

        <div class="actions">
            <button id="analyzeBtn" class="btn btn-primary" disabled>Analizza</button>
            <button id="historyBtn" class="btn btn-secondary" style="display:none">Storico</button>
            <button id="clearBtn" class="btn btn-secondary">Cancella</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div class="loading-text">Analisi in corso</div>
        </div>

        <div id="results" class="results">
            <div id="resultsContent"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
